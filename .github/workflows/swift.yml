name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── iOS build ──────────────────────────────────────────────────────────────
  # `swift build` needs a Package.swift; this is an .xcodeproj, so build with
  # xcodebuild (ported from the fix in PR #1, iOS job only).
  ios-build:
    name: iOS Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project KebabLocator.xcodeproj \
            -scheme KebabLocator

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project KebabLocator.xcodeproj \
            -scheme KebabLocator \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
